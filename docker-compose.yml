services:
  mongodb:
    image: mongo:7
    container_name: deployforge-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - deployforge-mongo:/data/db

  backend:
    build: ./backend
    container_name: deployforge-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/deployforge
      BUILD_WORKSPACE: /tmp/deployforge-builds
      NGINX_CONFIG_DIR: /app/deployments
      NGINX_ENABLED: "true"
      NGINX_RELOAD_MODE: docker
      NGINX_CONTAINER_NAME: deployforge-nginx
      PREVIEW_PROXY_HOST: 127.0.0.1
      DOCKER_BIND_HOST: 0.0.0.0
      HEALTHCHECK_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/deployments:/app/deployments
    depends_on:
      - mongodb

  nginx:
    image: nginx:alpine
    container_name: deployforge-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/deployments:/etc/nginx/deployforge:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  deployforge-mongo:
